name: CI

on:
  push:
    branches: [v0.3.x, v0.2.x_main, main]
  pull_request:
    branches: [v0.3.x, v0.2.x_main, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze / Test / Build APK
    # 固定镜像而不是 ubuntu-latest：latest 已宣布 2026-10 起迁到 Ubuntu 26，
    # 跟随漂移会让“昨天能过今天挂”难以排查。
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Flutter 钉死到 3.44.9：这是 Material 被拆成 material_ui 独立包之前的
      # 最后一条 stable 线，flutter/material.dart 仍是正统写法。
      - name: Set up Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          set -x
          flutter --version
          dart --version
          java -version

      # release 签名：从 Secrets 还原固定的 keystore，这样每次构建出来的 APK
      # 签名一致，可以直接覆盖安装上一版（否则 Android 会因为签名不同而拒绝）。
      - name: Prepare release signing (from secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::没有 ANDROID_KEYSTORE_BASE64，release 将退回 debug 签名（无法覆盖安装旧包）"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/epd-release.p12
          cat > android/key.properties <<EOF
          storeFile=app/epd-release.p12
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          echo "release 签名配置就绪：$(grep -c . android/key.properties) 行"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Show resolved dependency versions
        run: |
          echo '================ pubspec.lock ================'
          cat pubspec.lock
          echo '=============================================='

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # 只编 arm64-v8a：现在的手机基本全是 arm64，其它架构纯属白占体积。
      - name: Build debug APK (arm64 only)
        run: flutter build apk --debug --target-platform android-arm64

      # release 走 AOT，且 build.gradle.kts 里开了 R8 代码压缩 + 资源裁剪。
      - name: Build release APK (arm64 only, R8 optimized)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Show APK sizes
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APKs
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 14
