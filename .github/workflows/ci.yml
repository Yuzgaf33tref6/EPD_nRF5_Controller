name: CI

on:
  push:
    branches: [rebuild]
  pull_request:
    branches: [rebuild]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze / Test / Build APK
    # 固定镜像而不是 ubuntu-latest：latest 已宣布 2026-10 起迁到 Ubuntu 26，
    # 跟随漂移会让“昨天能过今天挂”难以排查。
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Flutter 钉死到 3.44.9：这是 Material 被拆成 material_ui 独立包之前的
      # 最后一条 stable 线，flutter/material.dart 仍是正统写法。
      - name: Set up Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          set -x
          flutter --version
          dart --version
          java -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Show resolved dependency versions
        run: |
          echo '================ pubspec.lock ================'
          cat pubspec.lock
          echo '=============================================='

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      # release 走 AOT，比 debug 小一个数量级；--split-per-abi 只打每种 CPU 架构自己的引擎。
      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Show APK sizes
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APKs
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 14
