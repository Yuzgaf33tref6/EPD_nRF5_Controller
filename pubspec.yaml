name: epd_controller
description: EPD-nRF5 墨水屏控制器 Android 客户端
publish_to: 'none'
version: 0.3.0+4
environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # BLE 传输层。Dart 层 API 5.5.0 与 5.6.0 完全一致，但 5.6.0 的原生实现要求
  # compileSdk 37 / AGP 9.1 / Kotlin 2.4.10，对比本项目（Flutter 3.44.9 自带
  # compileSdk 36、AGP 8.11.1、Kotlin 2.2.20）跨度过大，故钉在 5.5.0
  # （原生层 compileSdk 33 / AGP 8.0.2 / Kotlin 1.8.21）。
  flutter_reactive_ble: 5.5.0
  # 显式声明原生实现，避免 ^5.5.0 把 reactive_ble_mobile 解析到 5.6.0。
  reactive_ble_mobile: 5.5.0

  # 运行时权限。flutter_reactive_ble 的原生层不做任何权限申请，
  # Android 12+ 必须由 App 自己申请 BLUETOOTH_SCAN / BLUETOOTH_CONNECT。
  # 同理钉版本：permission_handler 13 会拉 permission_handler_android 14，
  # 后者要求 compileSdk 37 / Kotlin 2.3.20；12.0.3 拉的是 13.x（compileSdk 35）。
  permission_handler: 12.0.3
  permission_handler_android: 13.0.1

  # 选图（画布导入图片）。同样钉版本：image_picker 1.2.4 会拉
  # image_picker_android ^0.8.13，而 0.8.13+25 的原生层要求 AGP 8.13.1 / Kotlin 2.3.20，
  # 本项目是 AGP 8.11.1 / Kotlin 2.2.20；0.8.13+1 用 AGP 8.12.1 / minSdk 21，跨度最小。
  image_picker: 1.2.4
  image_picker_android: 0.8.13+1

dev_dependencies:
  flutter_test:
    sdk: flutter

# 本地打过补丁的 reactive_ble_mobile（见 third_party/reactive_ble_mobile/PATCH.md）。
# 补丁内容：通知订阅模式 DEFAULT → QUICK_SETUP。上游 DEFAULT 会丢掉「设备收到 CCCD
# 写入后立刻推送的第一条通知」，而 EPD-nRF5 固件正是用这条通知上报引脚与驱动号，
# 不改的话驱动自动识别永远拿不到数据。
dependency_overrides:
  reactive_ble_mobile:
    path: third_party/reactive_ble_mobile

flutter:
  uses-material-design: true
  assets:
    # 蓝噪声抖动用的 64×64 阈值纹理（来源与许可见 assets/NOTICE.md）。
    - assets/blue_noise_64.png
